<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0284c7">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'">
<meta name="description" content="Controle financeiro pessoal que funciona no celular e guarda os dados só no seu aparelho.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Controle Financeiro</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col md:flex-row">
<a href="#conteudoPrincipal" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[90] focus:bg-white focus:text-slate-900 focus:px-3 focus:py-2 focus:rounded-lg focus:shadow">Pular para o conteúdo</a>

<header class="md:hidden safe-top bg-white border-b border-slate-200 px-4 pb-3 flex items-center gap-2 sticky top-0 z-30">
    <button data-click="toggleMobileSidebar" aria-label="Abrir menu" class="btn-icone text-slate-600 hover:text-slate-900">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>
    <div class="flex items-center space-x-2">
        <span class="text-xl">💎</span>
        <h1 class="font-bold text-slate-900 text-lg">Controle Financeiro</h1>
    </div>
</header>

<div id="sidebarOverlay" data-click="toggleMobileSidebar" class="fixed inset-0 bg-black/40 z-40 hidden md:hidden"></div>

<aside id="sidebar" class="sidebar-transition fixed md:sticky md:top-0 md:h-screen inset-y-0 left-0 z-50 w-64 md:w-56 shrink-0 bg-white border-r border-slate-200 flex flex-col transform -translate-x-full md:translate-x-0">
    <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <div class="w-7 h-7 rounded-lg bg-sky-700 text-white flex items-center justify-center text-sm">💎</div>
            <h2 class="font-bold text-slate-900 text-sm">Finanças</h2>
        </div>
        <button data-click="toggleMobileSidebar" aria-label="Fechar menu" class="md:hidden btn-icone text-slate-500 text-lg leading-none">✕</button>
    </div>

    <div class="flex-1 overflow-y-auto px-3 py-3 space-y-3">
        <nav class="space-y-0.5" id="navPrincipal"></nav>
        <div class="border-t border-slate-100 pt-3 space-y-2" id="navMeses"></div>
    </div>

    <div class="px-3 pt-3 border-t border-slate-100 space-y-2 safe-bottom-sm">
        <button data-click="abrirModalMes" class="btn btn-secundario w-full">+ Mês</button>
        <div class="grid grid-cols-3 gap-1.5">
            <button data-click="exportarDados" class="btn btn-secundario btn-sm">Backup</button>
            <label class="btn btn-secundario btn-sm cursor-pointer">
                Restaurar
                <input type="file" data-change="importarDados" class="hidden" accept=".json,application/json">
            </label>
            <button data-click="exportarCSV" class="btn btn-secundario btn-sm">CSV</button>
        </div>
    </div>
</aside>

<button id="fab" data-click="abrirRapido" aria-label="Lançamento rápido" class="fab-pos fixed right-4 z-30 w-14 h-14 rounded-full bg-sky-700 hover:bg-sky-800 text-white text-3xl leading-none shadow-lg flex items-center justify-center">+</button>

<div id="toast" role="status" aria-live="polite" class="toast-pos hidden fixed left-1/2 -translate-x-1/2 z-[70] bg-slate-900 text-white text-sm rounded-xl shadow-lg pl-4 pr-2 py-2 items-center gap-2 flex"></div>

<main class="main-pad flex-1 min-w-0 w-full max-w-6xl mx-auto p-4 md:p-8 space-y-6">
    <div id="avisoStorage"></div>
    <div id="avisoBackup"></div>
    <noscript><div class="bg-rose-100 p-4 text-rose-700 rounded-xl text-sm">Este app precisa de JavaScript ativado.</div></noscript>
    <div id="conteudoPrincipal" tabindex="-1" class="space-y-6 outline-none"><p class="text-sm text-slate-500">Carregando...</p></div>
</main>

<nav id="barraInferior" aria-label="Navegação principal" class="barra-inferior md:hidden fixed bottom-0 inset-x-0 z-30 bg-white border-t border-slate-200 grid grid-cols-4"></nav>

<div id="modalMes" role="dialog" aria-modal="true" aria-label="Adicionar mês" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/40 p-4" data-fundo="modalMes">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 space-y-4">
        <div>
            <h3 class="font-bold text-slate-900 text-base">Adicionar mês</h3>
            <p class="text-xs text-slate-500">O mês entra na posição cronológica. Depois você pode mexer na ordem pelas setas da barra lateral.</p>
        </div>
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label for="novoMesSel" class="block text-xs font-bold text-slate-500 mb-1">Mês</label>
                <select id="novoMesSel" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium">
                    <option value="1">Janeiro</option><option value="2">Fevereiro</option><option value="3">Março</option>
                    <option value="4">Abril</option><option value="5">Maio</option><option value="6">Junho</option>
                    <option value="7">Julho</option><option value="8">Agosto</option><option value="9">Setembro</option>
                    <option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option>
                </select>
            </div>
            <div>
                <label for="novoAnoInp" class="block text-xs font-bold text-slate-500 mb-1">Ano</label>
                <input type="number" id="novoAnoInp" data-enter="confirmarNovoMes" min="1900" max="2999" inputmode="numeric" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium">
            </div>
        </div>
        <p id="modalMesErro" class="hidden text-xs font-semibold text-rose-600"></p>
        <div class="flex justify-end gap-2">
            <button data-click="fechar" data-click-args="[&quot;modalMes&quot;]" class="btn btn-secundario">Cancelar</button>
            <button data-click="confirmarNovoMes" class="btn btn-primario">Adicionar</button>
        </div>
    </div>
</div>

<div id="modalLanc" role="dialog" aria-modal="true" aria-label="Editar lançamento" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/40 p-4" data-fundo="modalLanc">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 space-y-3">
        <h3 class="font-bold text-slate-900 text-base">Editar lançamento</h3>
        <div>
            <label for="editData" class="block text-xs font-bold text-slate-500 mb-1">Data</label>
            <input type="date" id="editData" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium">
        </div>
        <div>
            <label for="editCat" class="block text-xs font-bold text-slate-500 mb-1">Categoria</label>
            <select id="editCat" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium"></select>
        </div>
        <div>
            <label for="editPag" class="block text-xs font-bold text-slate-500 mb-1">Forma de pagamento</label>
            <select id="editPag" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium"></select>
        </div>
        <div>
            <label for="editDesc" class="block text-xs font-bold text-slate-500 mb-1">Descrição</label>
            <input type="text" id="editDesc" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium">
        </div>
        <div>
            <label for="editValor" class="block text-xs font-bold text-slate-500 mb-1">Valor (R$)</label>
            <input type="number" step="0.01" inputmode="decimal" id="editValor" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium">
        </div>
        <p id="editErro" class="hidden text-xs font-semibold text-rose-600"></p>
        <div class="flex justify-end gap-2 pt-1">
            <button data-click="fechar" data-click-args="[&quot;modalLanc&quot;]" class="btn btn-secundario">Cancelar</button>
            <button data-click="salvarEdicao" class="btn btn-primario">Salvar</button>
        </div>
    </div>
</div>

<div id="modalRapido" role="dialog" aria-modal="true" aria-label="Lançamento rápido" class="fixed inset-0 z-[60] hidden items-end sm:items-center justify-center bg-black/40 p-4" data-fundo="modalRapido">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-5 space-y-4 max-h-[92vh] overflow-y-auto">
        <h3 class="font-bold text-slate-900 text-base">Lançamento rápido</h3>
        <div>
            <label for="rapValor" class="block text-sm font-bold text-slate-600 mb-1">Valor (R$)</label>
            <input type="number" step="0.01" inputmode="decimal" id="rapValor" data-enter="focarCampo" data-enter-args="[&quot;rapDesc&quot;]" placeholder="0,00" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 h-16 text-3xl font-bold">
        </div>
        <div>
            <label for="rapDesc" class="block text-sm font-bold text-slate-600 mb-1">Descrição</label>
            <input type="text" id="rapDesc" data-enter="aposDescRapida" data-change="sugerirRapido" placeholder="Ex: Mercado, Uber" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium">
        </div>
        <div>
            <span id="rotRapCat" class="block text-sm font-bold text-slate-600 mb-1">Categoria</span>
            <div id="rapCat" role="radiogroup" aria-labelledby="rotRapCat"></div>
        </div>
        <div>
            <span id="rotRapPag" class="block text-sm font-bold text-slate-600 mb-1">Pagamento</span>
            <div id="rapPag" role="radiogroup" aria-labelledby="rotRapPag"></div>
        </div>
        <div id="boxRapParc" class="hidden">
            <label for="rapParc" class="block text-sm font-bold text-slate-600 mb-1">Parcelas (1 = à vista). O valor é o total.</label>
            <input type="number" min="1" max="48" inputmode="numeric" id="rapParc" value="1" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium">
        </div>
        <div>
            <label for="rapData" class="block text-sm font-bold text-slate-600 mb-1">Data</label>
            <input type="date" id="rapData" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium">
        </div>
        <label class="flex items-center gap-3 text-sm font-semibold text-slate-700 min-h-[44px]">
            <input type="checkbox" id="rapEstorno" class="w-6 h-6">
            Estorno ou reembolso (reduz o gasto)
        </label>
        <p id="rapErro" role="alert" class="hidden text-sm font-semibold text-rose-700"></p>
        <div class="flex justify-end gap-2 pt-1">
            <button data-click="fechar" data-click-args="[&quot;modalRapido&quot;]" class="btn btn-secundario">Cancelar</button>
            <button data-click="salvarRapido" class="btn btn-primario">Salvar</button>
        </div>
    </div>
</div>

<div id="modalConfirma" role="alertdialog" aria-modal="true" aria-labelledby="confirmaTexto" class="fixed inset-0 z-[80] hidden items-center justify-center bg-black/40 p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 space-y-4">
        <p id="confirmaTexto" class="text-sm text-slate-700"></p>
        <div class="flex justify-end gap-2">
            <button id="confirmaCancelar" data-click="fecharDialogo" data-click-args="[false]" class="btn btn-secundario">Cancelar</button>
            <button id="confirmaOk" data-click="fecharDialogo" data-click-args="[true]" class="btn btn-primario">OK</button>
        </div>
    </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
