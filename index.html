<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0284c7">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'">
<meta name="description" content="Controle financeiro pessoal que funciona no celular e guarda os dados só no seu aparelho.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Controle Financeiro</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col md:flex-row">

<header class="md:hidden bg-white border-b border-slate-200 px-4 pb-3 flex justify-between items-center sticky top-0 z-30" data-safe="top">
    <div class="flex items-center space-x-2">
        <span class="text-xl">💎</span>
        <h1 class="font-bold text-slate-900 text-lg">Controle Financeiro</h1>
    </div>
    <button data-click="toggleMobileSidebar" aria-label="Abrir menu" class="p-2 text-slate-600 hover:text-slate-900">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>
</header>

<div id="sidebarOverlay" data-click="toggleMobileSidebar" class="fixed inset-0 bg-black/40 z-40 hidden md:hidden"></div>

<aside id="sidebar" class="sidebar-transition fixed md:sticky md:top-0 md:h-screen inset-y-0 left-0 z-50 w-64 md:w-56 shrink-0 bg-white border-r border-slate-200 flex flex-col transform -translate-x-full md:translate-x-0">
    <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <div class="w-7 h-7 rounded-lg bg-sky-600 text-white flex items-center justify-center text-sm">💎</div>
            <h2 class="font-bold text-slate-900 text-sm">Finanças</h2>
        </div>
        <button data-click="toggleMobileSidebar" aria-label="Fechar menu" class="md:hidden p-1 text-slate-500 text-lg leading-none">✕</button>
    </div>

    <div class="flex-1 overflow-y-auto px-3 py-3 space-y-3">
        <nav class="space-y-0.5" id="navPrincipal"></nav>
        <div class="border-t border-slate-100 pt-3 space-y-2" id="navMeses"></div>
    </div>

    <div class="px-3 pt-3 border-t border-slate-100 space-y-2" data-safe="bottom">
        <button data-click="abrirModalMes" class="w-full py-2 bg-sky-50 hover:bg-sky-100 text-sky-700 font-bold text-xs rounded-lg transition">+ Mês</button>
        <div class="grid grid-cols-3 gap-1.5">
            <button data-click="exportarDados" class="py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-semibold rounded-md border border-slate-300 text-center">Backup</button>
            <label class="py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-semibold rounded-md border border-slate-300 text-center cursor-pointer">
                Restaurar
                <input type="file" data-change="importarDados" class="hidden" accept=".json,application/json">
            </label>
            <button data-click="exportarCSV" class="py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-semibold rounded-md border border-slate-300 text-center">CSV</button>
        </div>
    </div>
</aside>

<button id="puxador" data-click="toggleMobileSidebar" aria-label="Abrir ou fechar o menu" aria-expanded="false" class="md:hidden fixed top-1/2 -translate-y-1/2 z-[55] w-6 h-16 rounded-r-xl bg-sky-600 text-white shadow-lg flex items-center justify-center gap-1" data-puxador>
    <span class="block w-0.5 h-7 rounded bg-white/80"></span><span class="block w-0.5 h-7 rounded bg-white/80"></span>
</button>

<button id="fab" data-click="abrirRapido" aria-label="Lançamento rápido" class="fixed right-4 z-30 w-14 h-14 rounded-full bg-sky-600 hover:bg-sky-700 text-white text-3xl leading-none shadow-lg flex items-center justify-center" data-fab>+</button>

<div id="toast" role="status" aria-live="polite" class="hidden fixed left-1/2 -translate-x-1/2 z-[70] bg-slate-900 text-white text-sm rounded-xl shadow-lg pl-4 pr-2 py-2 items-center gap-2 flex" data-toast></div>

<main class="flex-1 min-w-0 w-full max-w-6xl mx-auto p-4 md:p-8 space-y-6" data-safe="bottom-lg">
    <div id="avisoStorage"></div>
    <div id="avisoBackup"></div>
    <noscript><div class="bg-rose-100 p-4 text-rose-700 rounded-xl text-sm">Este app precisa de JavaScript ativado.</div></noscript>
    <div id="conteudoPrincipal" class="space-y-6"><p class="text-sm text-slate-500">Carregando...</p></div>
</main>

<div id="modalMes" role="dialog" aria-modal="true" aria-label="Adicionar mês" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/40 p-4" data-fundo="modalMes">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 space-y-4">
        <div>
            <h3 class="font-bold text-slate-900 text-base">Adicionar mês</h3>
            <p class="text-xs text-slate-500">O mês entra na posição cronológica. Depois você pode mexer na ordem pelas setas da barra lateral.</p>
        </div>
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label for="novoMesSel" class="block text-xs font-bold text-slate-500 mb-1">Mês</label>
                <select id="novoMesSel" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium">
                    <option value="1">Janeiro</option><option value="2">Fevereiro</option><option value="3">Março</option>
                    <option value="4">Abril</option><option value="5">Maio</option><option value="6">Junho</option>
                    <option value="7">Julho</option><option value="8">Agosto</option><option value="9">Setembro</option>
                    <option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option>
                </select>
            </div>
            <div>
                <label for="novoAnoInp" class="block text-xs font-bold text-slate-500 mb-1">Ano</label>
                <input type="number" id="novoAnoInp" min="1900" max="2999" inputmode="numeric" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium">
            </div>
        </div>
        <p id="modalMesErro" class="hidden text-xs font-semibold text-rose-600"></p>
        <div class="flex justify-end gap-2">
            <button data-click="fechar" data-click-args="[&quot;modalMes&quot;]" class="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg">Cancelar</button>
            <button data-click="confirmarNovoMes" class="px-4 py-2 text-xs font-bold text-white bg-sky-600 hover:bg-sky-700 rounded-lg shadow">Adicionar</button>
        </div>
    </div>
</div>

<div id="modalLanc" role="dialog" aria-modal="true" aria-label="Editar lançamento" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/40 p-4" data-fundo="modalLanc">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 space-y-3">
        <h3 class="font-bold text-slate-900 text-base">Editar lançamento</h3>
        <div>
            <label for="editData" class="block text-xs font-bold text-slate-500 mb-1">Data</label>
            <input type="date" id="editData" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium">
        </div>
        <div>
            <label for="editCat" class="block text-xs font-bold text-slate-500 mb-1">Categoria</label>
            <select id="editCat" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium"></select>
        </div>
        <div>
            <label for="editPag" class="block text-xs font-bold text-slate-500 mb-1">Forma de pagamento</label>
            <select id="editPag" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium"></select>
        </div>
        <div>
            <label for="editDesc" class="block text-xs font-bold text-slate-500 mb-1">Descrição</label>
            <input type="text" id="editDesc" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium">
        </div>
        <div>
            <label for="editValor" class="block text-xs font-bold text-slate-500 mb-1">Valor (R$)</label>
            <input type="number" step="0.01" inputmode="decimal" id="editValor" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium">
        </div>
        <p id="editErro" class="hidden text-xs font-semibold text-rose-600"></p>
        <div class="flex justify-end gap-2 pt-1">
            <button data-click="fechar" data-click-args="[&quot;modalLanc&quot;]" class="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg">Cancelar</button>
            <button data-click="salvarEdicao" class="px-4 py-2 text-xs font-bold text-white bg-sky-600 hover:bg-sky-700 rounded-lg shadow">Salvar</button>
        </div>
    </div>
</div>

<div id="modalRapido" role="dialog" aria-modal="true" aria-label="Lançamento rápido" class="fixed inset-0 z-[60] hidden items-end sm:items-center justify-center bg-black/40 p-4" data-fundo="modalRapido">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-5 space-y-3">
        <h3 class="font-bold text-slate-900 text-base">Lançamento rápido</h3>
        <div>
            <label for="rapValor" class="block text-xs font-bold text-slate-500 mb-1">Valor (R$)</label>
            <input type="number" step="0.01" inputmode="decimal" id="rapValor" placeholder="0.00" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium">
        </div>
        <div>
            <label for="rapDesc" class="block text-xs font-bold text-slate-500 mb-1">Descrição</label>
            <input type="text" id="rapDesc" placeholder="Ex: Mercado, Uber" data-enter="sugerirRapido" data-change="sugerirRapido" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium">
        </div>
        <div>
            <label for="rapCat" class="block text-xs font-bold text-slate-500 mb-1">Categoria</label>
            <select id="rapCat" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium"></select>
        </div>
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label for="rapPag" class="block text-xs font-bold text-slate-500 mb-1">Pagamento</label>
                <select id="rapPag" data-change="rapidoMostrarParcelas" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium"></select>
            </div>
            <div>
                <label for="rapData" class="block text-xs font-bold text-slate-500 mb-1">Data</label>
                <input type="date" id="rapData" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium">
            </div>
        </div>
        <div id="boxRapParc" class="hidden">
            <label for="rapParc" class="block text-xs font-bold text-slate-500 mb-1">Parcelas (1 = à vista). O valor é o total.</label>
            <input type="number" min="1" max="48" inputmode="numeric" id="rapParc" value="1" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium">
        </div>
        <p id="rapErro" class="hidden text-xs font-semibold text-rose-600"></p>
        <div class="flex justify-end gap-2 pt-1">
            <button data-click="fechar" data-click-args="[&quot;modalRapido&quot;]" class="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg">Cancelar</button>
            <button data-click="salvarRapido" class="px-4 py-2 text-xs font-bold text-white bg-sky-600 hover:bg-sky-700 rounded-lg shadow">Salvar</button>
        </div>
    </div>
</div>

<div id="modalConfirma" role="alertdialog" aria-modal="true" aria-labelledby="confirmaTexto" class="fixed inset-0 z-[80] hidden items-center justify-center bg-black/40 p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 space-y-4">
        <p id="confirmaTexto" class="text-sm text-slate-700"></p>
        <div class="flex justify-end gap-2">
            <button id="confirmaCancelar" data-click="fecharDialogo" data-click-args="[false]" class="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg">Cancelar</button>
            <button id="confirmaOk" data-click="fecharDialogo" data-click-args="[true]" class="px-4 py-2 text-xs font-bold text-white bg-sky-600 hover:bg-sky-700 rounded-lg shadow">OK</button>
        </div>
    </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
