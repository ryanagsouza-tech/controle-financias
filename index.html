<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0284c7">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Controle financeiro pessoal que funciona no celular e guarda os dados só no seu aparelho.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Controle Financeiro</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col md:flex-row">

<header class="md:hidden bg-white border-b border-slate-200 px-4 pb-3 flex justify-between items-center sticky top-0 z-30" style="padding-top:max(0.75rem, env(safe-area-inset-top))">
    <div class="flex items-center space-x-2">
        <span class="text-xl">💎</span>
        <h1 class="font-bold text-slate-900 text-lg">Controle Financeiro</h1>
    </div>
    <button onclick="toggleMobileSidebar()" aria-label="Abrir menu" class="p-2 text-slate-600 hover:text-slate-900">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>
</header>

<div id="sidebarOverlay" onclick="toggleMobileSidebar()" class="fixed inset-0 bg-black/40 z-40 hidden md:hidden"></div>

<aside id="sidebar" class="sidebar-transition fixed md:sticky md:top-0 md:h-screen inset-y-0 left-0 z-50 w-72 md:w-64 shrink-0 bg-white border-r border-slate-200 flex flex-col transform -translate-x-full md:translate-x-0">
    <div class="p-5 border-b border-slate-100 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-sky-600 text-white flex items-center justify-center shadow-sm">💎</div>
            <div>
                <h2 class="font-bold text-slate-900 text-sm">Controle Financeiro</h2>
                <p class="text-xs text-slate-400">Dados salvos neste aparelho</p>
            </div>
        </div>
        <button onclick="toggleMobileSidebar()" aria-label="Fechar menu" class="md:hidden p-2 text-slate-500 text-lg leading-none">✕</button>
    </div>

    <div class="flex-1 overflow-y-auto p-4 space-y-6">
        <div>
            <p class="px-3 text-[10px] font-bold tracking-wider text-slate-400 uppercase mb-2">Menu Principal</p>
            <nav class="space-y-1" id="navPrincipal"></nav>
        </div>
        <div>
            <p class="px-3 text-[10px] font-bold tracking-wider text-slate-400 uppercase mb-2">Planejamento Mensal</p>
            <nav class="space-y-1" id="navMeses"></nav>
        </div>
    </div>

    <div class="p-4 border-t border-slate-100 space-y-2" style="padding-bottom:max(1rem, env(safe-area-inset-bottom))">
        <button onclick="abrirModalMes()" class="w-full py-2.5 px-3 bg-sky-50 hover:bg-sky-100 text-sky-700 font-bold text-xs rounded-xl transition">+ Adicionar Novo Mês</button>
        <div class="flex space-x-2">
            <button onclick="exportarDados()" class="flex-1 py-2 px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border border-slate-300 text-center">Backup</button>
            <label class="flex-1 py-2 px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border border-slate-300 text-center cursor-pointer">
                Restaurar
                <input type="file" onchange="importarDados(event)" class="hidden" accept=".json,application/json">
            </label>
            <button onclick="exportarCSV()" class="flex-1 py-2 px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border border-slate-300 text-center">CSV</button>
        </div>
    </div>
</aside>

<main class="flex-1 min-w-0 w-full max-w-6xl mx-auto p-4 md:p-8 space-y-6" style="padding-bottom:max(2rem, env(safe-area-inset-bottom))">
    <div id="avisoStorage"></div>
    <noscript><div class="bg-rose-100 p-4 text-rose-700 rounded-xl text-sm">Este app precisa de JavaScript ativado.</div></noscript>
    <div id="conteudoPrincipal" class="space-y-6"><p class="text-sm text-slate-500">Carregando...</p></div>
</main>

<div id="modalMes" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/40 p-4" onclick="if (event.target === this) fechar('modalMes')">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 space-y-4">
        <div>
            <h3 class="font-bold text-slate-900 text-base">Adicionar mês</h3>
            <p class="text-xs text-slate-500">O mês entra na posição cronológica. Depois você pode mexer na ordem pelas setas da barra lateral.</p>
        </div>
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label for="novoMesSel" class="block text-xs font-bold text-slate-500 mb-1">Mês</label>
                <select id="novoMesSel" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium">
                    <option value="1">Janeiro</option><option value="2">Fevereiro</option><option value="3">Março</option>
                    <option value="4">Abril</option><option value="5">Maio</option><option value="6">Junho</option>
                    <option value="7">Julho</option><option value="8">Agosto</option><option value="9">Setembro</option>
                    <option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option>
                </select>
            </div>
            <div>
                <label for="novoAnoInp" class="block text-xs font-bold text-slate-500 mb-1">Ano</label>
                <input type="number" id="novoAnoInp" min="1900" max="2999" inputmode="numeric" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium">
            </div>
        </div>
        <p id="modalMesErro" class="hidden text-xs font-semibold text-rose-600"></p>
        <div class="flex justify-end gap-2">
            <button onclick="fechar('modalMes')" class="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg">Cancelar</button>
            <button onclick="confirmarNovoMes()" class="px-4 py-2 text-xs font-bold text-white bg-sky-600 hover:bg-sky-700 rounded-lg shadow">Adicionar</button>
        </div>
    </div>
</div>

<div id="modalLanc" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/40 p-4" onclick="if (event.target === this) fechar('modalLanc')">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 space-y-3">
        <h3 class="font-bold text-slate-900 text-base">Editar lançamento</h3>
        <div>
            <label for="editData" class="block text-xs font-bold text-slate-500 mb-1">Data</label>
            <input type="date" id="editData" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium">
        </div>
        <div>
            <label for="editCat" class="block text-xs font-bold text-slate-500 mb-1">Categoria</label>
            <select id="editCat" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium"></select>
        </div>
        <div>
            <label for="editPag" class="block text-xs font-bold text-slate-500 mb-1">Forma de pagamento</label>
            <select id="editPag" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium"></select>
        </div>
        <div>
            <label for="editDesc" class="block text-xs font-bold text-slate-500 mb-1">Descrição</label>
            <input type="text" id="editDesc" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium">
        </div>
        <div>
            <label for="editValor" class="block text-xs font-bold text-slate-500 mb-1">Valor (R$)</label>
            <input type="number" step="0.01" inputmode="decimal" id="editValor" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-sm font-medium">
        </div>
        <p id="editErro" class="hidden text-xs font-semibold text-rose-600"></p>
        <div class="flex justify-end gap-2 pt-1">
            <button onclick="fechar('modalLanc')" class="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg">Cancelar</button>
            <button onclick="salvarEdicao()" class="px-4 py-2 text-xs font-bold text-white bg-sky-600 hover:bg-sky-700 rounded-lg shadow">Salvar</button>
        </div>
    </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
